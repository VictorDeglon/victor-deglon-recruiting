title: "Victor Deglon | Opposite Hitter"
description: >-
  Recruiting profile for Victor Deglon, opposite hitter — measurables, film,
  schedule, and academics for college volleyball recruiting.
url: "https://victor.deglon.ai"
baseurl: ""
lang: en_US

# `image` drives og:image / twitter:image (jekyll-seo-tag). `logo` is a
# separate field only used for the JSON-LD organization logo — keep both
# pointed at the same file for consistency.
image: /assets/images/og-image.jpg
logo: /assets/images/og-image.jpg
twitter:
  card: summary_large_image
social:
  name: Victor Deglon
  links:

author:
  name: "Victor Deglon"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Nav order — used by _includes/nav.html
nav:
  - title: Home
    url: /
  - title: Stats
    url: /stats/
  - title: Film
    url: /film/
  - title: Schedule
    url: /schedule/
  - title: Academics
    url: /academics/
  - title: About
    url: /about/
  - title: Log
    url: /log/
  - title: Training
    url: /training/
  - title: Contact
    url: /contact/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "log-entry"
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
