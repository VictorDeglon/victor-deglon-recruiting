<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en_US' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% seo %}
  {% include person-schema.html %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }} — Log" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a>
      {% include nav.html %}
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  {% include footer.html %}

  <script>
    (function () {
      var header = document.querySelector('.site-header');
      if (!header) return;
      var onScroll = function () {
        header.classList.toggle('is-scrolled', window.scrollY > 4);
      };
      onScroll();
      window.addEventListener('scroll', onScroll, { passive: true });
    })();
  </script>
</body>
</html>
